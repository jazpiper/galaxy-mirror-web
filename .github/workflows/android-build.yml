name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      continue-on-error: true # gradlew 파일이 없을 경우 대비 예외 방지

    - name: Run unit tests
      run: |
        cd android
        ./gradlew app:testDebugUnitTest --no-daemon

    - name: Run viewer JavaScript tests
      run: node --test android/app/src/test/js/viewer-keyboard.test.mjs

    - name: Run lint
      run: |
        cd android
        ./gradlew app:lintDebug --no-daemon

    - name: Build with Gradle
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    - name: Upload Test and Lint Reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: verification-reports
        path: |
          android/app/build/reports/tests/
          android/app/build/reports/lint-results-debug.html
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v6
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
